services:
  - type: web
    name: travelpro-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # User must provide this secret manually in the Render Dashboard
      - key: JWT_SECRET
        sync: false # User must provide this secret manually in the Render Dashboard
